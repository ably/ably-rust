[package]
name = "ably"
version = "0.2.0"
edition = "2021"
description = "Ably client library SDK"
documentation = "https://docs.rs/ably"
readme = "README.md"
homepage = "https://ably.com"
repository = "https://github.com/ably/ably-rust"
license = "Apache-2.0"
keywords = ["ably", "realtime", "pubsub"]

include = [
  "Cargo.toml",
  "LICENSE",
  "src/**/*",
]

[dependencies]
aes = "0.8.1"
async-trait = "0.1"
base64 = "0.13.0"
cipher = "0.4.3"
chrono = { version = "0.4.19", features = ["serde"] }
hmac = "0.12.1"
rand = "0.8.5"
reqwest = { version = "0.11.10", features = ["json"] }
rmp-serde = "1.1.0"
serde = { version = "1.0.137", features = ["derive"] }
serde_bytes = "0.11.6"
serde_json = "1.0.81"
serde_repr = "0.1.8"
sha2 = "0.10.2"
tokio = { version = "1.18.2", features = ["time", "sync", "macros", "rt", "net"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
url = "2.2.2"
urlencoding = "2"
cbc = "0.1.2"
num-traits = "0.2.15"
num-derive = "0.3.3"

[dev-dependencies]
futures = "0.3.21"
tokio = { version = "1.18.2", features = ["full", "test-util"] }
http = "0.2"
jsonwebtoken = "9"

[features]
native-tls-alpn = ["reqwest/native-tls-alpn"]
rustls = ["reqwest/rustls"]
default = ["reqwest/native-tls-alpn"]
