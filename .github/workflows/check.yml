name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Rust version
        run: rustc -V

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Unit suite + conformance ratchets only. The live sandbox and uts-proxy
      # integration tests (tests_*_integration, tests_proxy*, and the network
      # tests_realtime_uts_* modules) require network access and are run
      # manually, not in CI.
      - name: Test
        run: cargo test --lib -- _unit_ design_conformance uts_coverage uts_channels_advanced
